services:
  app:
    image: ghcr.io/ryukkfps/manaswellness:latest
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  # Remove this service (and the app's `depends_on`) if DATABASE_URL in .env
  # already points at a managed MongoDB (e.g. Atlas) instead of a local one.
  mongo:
    image: mongo:7
    # Prisma requires Mongo to run as a replica set (even single-node) to
    # use transactions, which it relies on internally for writes/deletes.
    # DATABASE_URL in .env must include ?replicaSet=rs0 to match.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      # Must initiate with an explicit host — a bare rs.initiate() registers
      # the member under the container's own hostname (its container ID),
      # which other containers can't resolve, leaving the set stuck with no
      # reachable primary.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  uploads:
  mongo-data:
